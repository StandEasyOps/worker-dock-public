# Unsigned tester artifacts. Azure Trusted Signing, apt hosting, and winget
# publish are intentionally not run. See packaging/README.md.
#
# Action pins are full SHAs (DESIGN §11). Bump the SHA and the version comment together.
#
# Download/apt URLs are placeholders from packaging/urls.toml
# (https://get.standeasyops.com). This workflow does not provision DNS or hosting.
#
# The tag (vMAJOR.MINOR.PATCH, each field <= 65535) is stamped before bundling.
# workflow_dispatch must run on that tag ref; a branch ref fails the stamp step.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Configurable public download host. Not provisioned by this repository.
  DOWNLOAD_BASE_URL: https://get.standeasyops.com
  APT_BASE_URL: https://get.standeasyops.com/apt
  # Set to "true" only after Azure Trusted Signing secrets exist in the
  # `release` environment. The sign step below stays commented until then.
  SIGNING_ENABLED: "false"

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  linux-deb:
    name: Ubuntu .deb (unsigned)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            xdg-utils \
            build-essential \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # rust-toolchain action
        with:
          toolchain: "1.99.1"

      - name: Install frontend dependencies
        run: npm ci

      - name: Stamp release version from tag
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          node scripts/set-app-version.mjs --self-test
          node scripts/set-app-version.mjs --check-sync
          VERSION="$(node scripts/set-app-version.mjs --release-tag | tr -d '\r')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refused to stamp unexpected version: ${VERSION}" >&2
            exit 1
          fi
          node scripts/set-app-version.mjs "$VERSION"
          node scripts/set-app-version.mjs --check-sync "$VERSION"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Stamped ${VERSION} from ${RELEASE_REF_NAME}"

      - name: Build unsigned Debian package
        run: npm run tauri build -- --bundles deb

      - name: Check .deb exists and is unsigned
        run: |
          set -euo pipefail
          version="${APP_VERSION:?APP_VERSION is not set}"
          expected="worker-dock_${version}_amd64.deb"
          mapfile -t found < <(find src-tauri/target/release/bundle/deb -name '*.deb' -type f | sort)
          match=()
          for deb in "${found[@]}"; do
            if [[ "$(basename "$deb")" == "$expected" ]]; then
              match+=("$deb")
            fi
          done
          if [[ ${#match[@]} -ne 1 ]]; then
            echo "expected one ${expected} under src-tauri/target/release/bundle/deb" >&2
            if [[ ${#found[@]} -eq 0 ]]; then
              echo "found: (none)" >&2
            else
              printf 'found: %s\n' "${found[@]}" >&2
            fi
            exit 1
          fi
          mkdir -p dist
          cp "${match[0]}" "dist/${expected}"
          (cd dist && sha256sum -- "./${expected}" > SHA256SUMS-linux.txt)
          echo "Unsigned .deb artifacts:"
          cat dist/SHA256SUMS-linux.txt
          # No GPG/debsig step. Apt repo hosting is out of scope.

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-dock-linux-deb
          path: dist/
          if-no-files-found: error

  windows-msi:
    name: Windows MSI (unsigned)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # rust-toolchain action
        with:
          toolchain: "1.99.1"

      - name: Install frontend dependencies
        run: npm ci

      - name: Stamp release version from tag
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          node scripts/set-app-version.mjs --self-test
          node scripts/set-app-version.mjs --check-sync
          VERSION="$(node scripts/set-app-version.mjs --release-tag | tr -d '\r')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refused to stamp unexpected version: ${VERSION}" >&2
            exit 1
          fi
          node scripts/set-app-version.mjs "$VERSION"
          node scripts/set-app-version.mjs --check-sync "$VERSION"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Stamped ${VERSION} from ${RELEASE_REF_NAME}"

      - name: Build unsigned MSI
        run: npm run tauri build -- --bundles msi

      # Signing hook (disabled). When SIGNING_ENABLED is true and the `release`
      # environment has Azure Trusted Signing secrets, sign the exe and MSI:
      #
      #   environment: release
      #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
      #   TRUSTED_SIGNING_ACCOUNT, TRUSTED_SIGNING_PROFILE, TRUSTED_SIGNING_ENDPOINT
      #   timestamp: http://timestamp.acs.microsoft.com/
      #
      #   AzureSignTool sign -kvu <endpoint> -kvi <client> -kvs <secret> \
      #     -kvt <tenant> -kvc <account> -d "worker-dock" -tr \
      #     http://timestamp.acs.microsoft.com/ <exe-and-msi>
      #
      # Do not enable this until Stand Easy Ops has Trusted Signing. The
      # certificate must never be written to the runner disk.

      - name: Collect MSI and checksums
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { throw "APP_VERSION is not set" }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "APP_VERSION is not major.minor.build: $version" }
          $expected = "worker-dock_${version}_x64_en-US.msi"
          $msiDir = "src-tauri/target/release/bundle/msi"
          if (-not (Test-Path -LiteralPath $msiDir)) { throw "No MSI directory at $msiDir" }
          $found = @(Get-ChildItem -LiteralPath $msiDir -Filter *.msi -File)
          $match = @($found | Where-Object { $_.Name -eq $expected })
          if ($match.Count -ne 1) {
            $names = if ($found.Count -eq 0) { "(none)" } else { ($found | ForEach-Object Name) -join ", " }
            throw "expected one $expected under ${msiDir}; found: $names"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dest = Join-Path dist $expected
          Copy-Item -LiteralPath $match[0].FullName -Destination $dest
          Get-FileHash -Algorithm SHA256 -LiteralPath $dest |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $expected } |
            Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt
          Get-Content dist/SHA256SUMS-windows.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-dock-windows-msi
          path: dist/
          if-no-files-found: error

  draft-release:
    name: Draft GitHub Release
    needs: [linux-deb, windows-msi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # Publish gate. Maintainers must create this environment with
    # protection rules; GitHub otherwise auto-creates it unprotected.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-dock-linux-deb
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-dock-windows-msi
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Write placeholder latest.json
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(node scripts/set-app-version.mjs --release-tag | tr -d '\r')"
          deb="worker-dock_${version}_amd64.deb"
          msi="worker-dock_${version}_x64_en-US.msi"
          test -f "dist/${deb}"
          test -f "dist/${msi}"
          python3 - "$version" "$DOWNLOAD_BASE_URL" "$deb" "$msi" <<'PY'
          import json, sys
          version, base, deb, msi = sys.argv[1], sys.argv[2].rstrip("/"), sys.argv[3], sys.argv[4]
          payload = {
              "version": version,
              "notes": "Unsigned tester build. Azure Trusted Signing, apt hosting, and winget publish are not enabled.",
              "platforms": {
                  "linux-x86_64": {
                      "signature": "",
                      "url": f"{base}/releases/v{version}/{deb}",
                  },
                  "windows-x86_64": {
                      "signature": "",
                      "url": f"{base}/releases/v{version}/{msi}",
                  },
              },
          }
          with open("dist/latest.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY
          ls -l dist
          cat dist/latest.json

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: true
          name: worker-dock ${{ github.ref_name }} (unsigned)
          body: |
            Unsigned tester build of worker-dock.

            - Linux: `.deb` (Ubuntu 22.04 glibc baseline). Does **not** include the official `agent` CLI.
            - Windows: WiX MSI with embedded WebView2 bootstrapper. Built on `windows-latest`.
            - Download URLs in `latest.json` use the placeholder host `https://get.standeasyops.com` (not provisioned).
            - winget id **StandEasyOps.WorkerDock** is reserved in docs only — this release is not submitted to winget-pkgs.
            - Azure Trusted Signing and apt GPG signing are hooks only. Do not treat these files as trusted.

            Sideload for testers. SmartScreen and OS trust warnings are expected.
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
