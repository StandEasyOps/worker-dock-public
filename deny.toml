# Licence and source policy for src-tauri. Checked in CI with cargo-deny.
# Every entry is a licence this graph actually uses.
# MPL-2.0 is weak copyleft (cssparser, selectors, option-ext). GPL, LGPL, and AGPL are not allowed.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is transitive via gtk3-macros (Tauri). No upgrade is published." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 is transitive via keyring's secret-service stack. It was folded into zbus 6 with no compatible upgrade." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 is transitive via the same keyring stack. It was folded into zbus 6 with no compatible upgrade." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 is transitive via the same keyring stack. It was folded into zbus 6 with no compatible upgrade." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
