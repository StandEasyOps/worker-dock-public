[package]
name = "worker-dock"
version = "0.1.0"
description = "Desktop app by Stand Easy Ops to install, run, and manage personal self-hosted workers"
authors = ["Stand Easy Ops"]
edition = "2024"
license = "MIT"
repository = "https://github.com/StandEasyOps/worker-dock"
rust-version = "1.90"
default-run = "worker-dock"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "worker_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml_edit = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
tar = "0.4"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["fs", "process", "io-util", "time"] }
keyring = "4"
open = "5"
uuid = { version = "1", features = ["v4"] }
rfd = "0.17"
hostname = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
